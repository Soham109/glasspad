# Weekly update checks. The Swift packages have no outside dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    labels: ["dependencies"]
    groups:
      web:
        patterns: ["*"]
    ignore:
      # TypeScript 7 breaks the web build; move to it by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /promo
    schedule:
      interval: monthly
    labels: ["dependencies"]
    groups:
      promo:
        patterns: ["*"]
