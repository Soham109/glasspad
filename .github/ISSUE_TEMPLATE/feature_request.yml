name: Feature request
description: Suggest something Glasspad could do.
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What do you want to do
      description: The task, not the solution. For example, "skip a slide without looking at my phone".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Another app, a workaround, or not at all.
    validations:
      required: false
  - type: textarea
    id: idea
    attributes:
      label: What Glasspad could do
    validations:
      required: false
